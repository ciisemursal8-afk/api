<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #f1f1f1;
        }

        .container {
            display: grid;
            grid-template-columns: 40% 60%;
            height: 100vh;
        }

        .surah-list {
            background: #087e75;
            padding: 20px;
            overflow-y: auto;
            color: white;
        }

        h2 {
            margin-bottom: 20px;
        }

        .heading, .surah {
            display: flex;
            /* grid-template-columns: 40px 1fr 50px; */
            justify-content: space-between;
            gap: 5px;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .heading {
            background: white;
            color: black;
        }

        .surah {
            background: #eeeeee;
            color: #333;
            cursor: pointer;
        }

        .surah:hover, .surah.active {
            background: #c5e5df;
        }

        .content {
            padding: 20px;
            overflow-y: auto;
            background: white;
        }

        .surah-title {
            background: #087e75;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .ayah {
            background: #eef5f3;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .ayah span {
            background: #087e75;
            color: white;
            padding: 8px;
            border-radius: 50%;
        }

        .ayah p {
            flex: 1;
            text-align: right;
            direction: rtl;
            font-size: 23px;
            line-height: 2;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="surah-list">
            <h2>All Surah</h2>

            <div class="heading">
                <span>Number</span>
                <span>Name</span>
                <span>Ayah</span>
            </div>

            <div id="surahList"></div>
        </div>

        <div class="content" id="content">
            <h2>Select Surah</h2>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
